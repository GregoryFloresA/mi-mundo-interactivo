<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mi Mundo Interactivo</title>

<style>

/* =========================================================
   CONFIGURACIÓN GENERAL
========================================================= */

:root{
    --azul-texto:#6686cc;
    --coral:#ed765f;
    --blanco:#ffffff;
    --sombra:0 20px 45px rgba(48,65,126,0.22);
    --sombra-suave:0 12px 28px rgba(48,65,126,0.16);
}

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;

    font-family:
        "Trebuchet MS",
        "Arial Rounded MT Bold",
        Arial,
        sans-serif;

    background:#b9cef8;
    color:#445278;

    transition:
        background 2s ease;
}


/* =========================================================
   TEMAS DE FONDO
========================================================= */

body.tema-nubes{
    background:
        linear-gradient(
            145deg,
            #9fc5f5 0%,
            #cad8ff 50%,
            #dfd1fa 100%
        );
}

body.tema-burbujas{
    background:
        linear-gradient(
            145deg,
            #bcebdc 0%,
            #cceef1 46%,
            #d3ddfa 100%
        );
}

body.tema-peces{
    background:
        linear-gradient(
            180deg,
            #70cce8 0%,
            #79d8d0 48%,
            #79cfa5 100%
        );
}

body.tema-aves{
    background:
        linear-gradient(
            160deg,
            #90c7f4 0%,
            #c7dbfa 50%,
            #ffd8bd 100%
        );
}


/* =========================================================
   CONTENEDORES DE LOS FONDOS
========================================================= */

.fondo{
    position:fixed;
    inset:0;
    overflow:hidden;

    pointer-events:none;

    opacity:0;

    transition:
        opacity 1.8s ease;

    z-index:0;
}

body.tema-nubes #fondoNubes,
body.tema-burbujas #fondoBurbujas,
body.tema-peces #fondoPeces,
body.tema-aves #fondoAves{
    opacity:1;
}


/* =========================================================
   FONDO DE NUBES
========================================================= */

.nube{
    position:absolute;

    width:260px;
    height:85px;

    left:-380px;

    border-radius:80px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.97),
            rgba(250,247,250,0.86)
        );

    opacity:0.86;

    box-shadow:
        0 15px 25px rgba(61,84,140,0.10);

    animation:
        moverNube 62s linear infinite;
}

.nube::before,
.nube::after{
    content:"";

    position:absolute;

    border-radius:50%;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.98),
            rgba(250,247,250,0.88)
        );
}

.nube::before{
    width:125px;
    height:125px;

    left:35px;
    top:-55px;
}

.nube::after{
    width:150px;
    height:150px;

    right:24px;
    top:-70px;
}

.nube-1{
    top:18%;
    transform:scale(0.82);
    animation-duration:64s;
}

.nube-2{
    top:70%;
    transform:scale(1.12);
    animation-duration:79s;
    animation-delay:-39s;
}

.nube-3{
    top:43%;
    transform:scale(0.58);
    animation-duration:70s;
    animation-delay:-23s;
}

@keyframes moverNube{

    0%{
        margin-left:-420px;
    }

    100%{
        margin-left:calc(100vw + 800px);
    }

}


/* =========================================================
   FONDO DE BURBUJAS
========================================================= */

.burbuja-fondo{
    position:absolute;

    bottom:-180px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 32% 28%,
            rgba(255,255,255,0.94),
            rgba(255,255,255,0.28) 52%,
            rgba(255,255,255,0.06)
        );

    border:
        2px solid rgba(255,255,255,0.32);

    box-shadow:
        inset 0 0 24px rgba(255,255,255,0.38);

    opacity:0.66;

    animation:
        subirBurbuja 28s ease-in infinite;
}

.burbuja-fondo:nth-child(1){
    width:85px;
    height:85px;
    left:8%;
    animation-duration:25s;
}

.burbuja-fondo:nth-child(2){
    width:150px;
    height:150px;
    left:28%;
    animation-duration:36s;
    animation-delay:-17s;
}

.burbuja-fondo:nth-child(3){
    width:62px;
    height:62px;
    left:48%;
    animation-duration:23s;
    animation-delay:-8s;
}

.burbuja-fondo:nth-child(4){
    width:125px;
    height:125px;
    left:68%;
    animation-duration:31s;
    animation-delay:-22s;
}

.burbuja-fondo:nth-child(5){
    width:190px;
    height:190px;
    left:83%;
    animation-duration:42s;
    animation-delay:-11s;
}

.burbuja-fondo:nth-child(6){
    width:52px;
    height:52px;
    left:18%;
    animation-duration:21s;
    animation-delay:-5s;
}

.burbuja-fondo:nth-child(7){
    width:95px;
    height:95px;
    left:58%;
    animation-duration:29s;
    animation-delay:-14s;
}

@keyframes subirBurbuja{

    0%{
        transform:
            translate3d(0,0,0)
            scale(0.88);

        opacity:0;
    }

    12%{
        opacity:0.65;
    }

    50%{
        transform:
            translate3d(35px,-55vh,0)
            scale(1);
    }

    100%{
        transform:
            translate3d(-25px,-125vh,0)
            scale(1.08);

        opacity:0;
    }

}


/* =========================================================
   FONDO DE PECES
========================================================= */

.pez{
    position:absolute;

    left:-180px;

    font-size:72px;

    opacity:0.68;

    filter:
        drop-shadow(
            0 10px 9px rgba(21,87,120,0.15)
        );

    animation:
        nadarPez 40s linear infinite;
}

.pez-1{
    top:18%;
    animation-duration:44s;
}

.pez-2{
    top:47%;
    font-size:95px;
    animation-duration:58s;
    animation-delay:-27s;
}

.pez-3{
    top:73%;
    font-size:62px;
    animation-duration:36s;
    animation-delay:-15s;
}

.pez-4{
    top:33%;
    font-size:52px;
    animation-duration:48s;
    animation-delay:-35s;
}

@keyframes nadarPez{

    0%{
        transform:
            translateX(-240px)
            translateY(0)
            scaleX(1);
    }

    25%{
        transform:
            translateX(30vw)
            translateY(-24px)
            scaleX(1);
    }

    55%{
        transform:
            translateX(65vw)
            translateY(22px)
            scaleX(1);
    }

    100%{
        transform:
            translateX(calc(100vw + 450px))
            translateY(-12px)
            scaleX(1);
    }

}

.planta-marina{
    position:absolute;

    bottom:-22px;

    font-size:150px;

    opacity:0.40;

    transform-origin:bottom center;

    animation:
        moverPlanta 8s ease-in-out infinite alternate;
}

.planta-1{
    left:5%;
}

.planta-2{
    left:37%;
    animation-delay:-3s;
}

.planta-3{
    right:7%;
    animation-delay:-5s;
}

@keyframes moverPlanta{

    from{
        transform:rotate(-3deg);
    }

    to{
        transform:rotate(4deg);
    }

}


/* =========================================================
   FONDO DE AVES
========================================================= */

.ave{
    position:absolute;

    left:-180px;

    font-size:70px;

    opacity:0.62;

    filter:
        drop-shadow(
            0 8px 8px rgba(66,88,150,0.12)
        );

    animation:
        volarAve 48s linear infinite;
}

.ave-1{
    top:18%;
    animation-duration:50s;
}

.ave-2{
    top:42%;
    font-size:50px;
    animation-duration:64s;
    animation-delay:-31s;
}

.ave-3{
    top:69%;
    font-size:82px;
    animation-duration:59s;
    animation-delay:-17s;
}

@keyframes volarAve{

    0%{
        transform:
            translateX(-250px)
            translateY(0)
            rotate(-2deg);
    }

    30%{
        transform:
            translateX(34vw)
            translateY(-35px)
            rotate(2deg);
    }

    65%{
        transform:
            translateX(68vw)
            translateY(22px)
            rotate(-2deg);
    }

    100%{
        transform:
            translateX(calc(100vw + 450px))
            translateY(-18px)
            rotate(1deg);
    }

}


/* =========================================================
   APLICACIÓN
========================================================= */

.aplicacion{
    position:relative;

    z-index:2;

    width:100%;
    height:100vh;

    min-height:620px;
}


/* =========================================================
   PANTALLA INICIAL
========================================================= */

#pantallaInicial{
    width:100%;
    height:100%;

    padding:
        clamp(18px,3vh,38px)
        clamp(18px,5vw,85px);

    display:flex;

    flex-direction:column;
    align-items:center;
    justify-content:center;

    transition:
        opacity 0.55s ease,
        transform 0.55s ease;
}

.burbuja-titulo{
    display:inline-block;

    padding:
        clamp(17px,2.5vh,28px)
        clamp(32px,6vw,90px);

    border-radius:38px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.98),
            rgba(249,246,255,0.91)
        );

    color:var(--coral);

    font-size:
        clamp(34px,5vw,72px);

    font-weight:900;

    letter-spacing:1px;

    text-shadow:
        0 4px 0 rgba(196,83,66,0.12);

    box-shadow:var(--sombra);
}

.burbuja-mensaje{
    display:inline-block;

    margin-top:
        clamp(26px,4vh,48px);

    padding:
        14px
        clamp(25px,4vw,55px);

    border-radius:30px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.98),
            rgba(248,246,255,0.91)
        );

    color:var(--azul-texto);

    font-size:
        clamp(23px,3vw,42px);

    font-weight:900;

    box-shadow:var(--sombra-suave);
}


/* =========================================================
   TARJETAS DE NIVELES
========================================================= */

#contenedorNiveles{
    position:relative;

    width:min(1250px,94vw);

    display:flex;
    align-items:stretch;
    justify-content:center;

    gap:
        clamp(22px,4vw,58px);

    margin-top:
        clamp(30px,5vh,62px);
}

.tarjeta-nivel{
    position:relative;

    width:
        clamp(210px,24vw,340px);

    min-height:
        clamp(285px,42vh,490px);

    padding:
        clamp(22px,3vh,38px)
        20px;

    border-radius:
        clamp(34px,4vw,58px);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;

    box-shadow:
        0 24px 45px rgba(62,76,135,0.23),
        inset 0 5px 12px rgba(255,255,255,0.52),
        inset 0 -10px 18px rgba(80,90,140,0.11);

    transform-origin:center center;

    transition:
        transform 0.88s cubic-bezier(0.22,1.2,0.36,1),
        opacity 0.55s ease;
}

.nivel-1{
    background:
        linear-gradient(
            160deg,
            #b8e9bd,
            #7dcf9e
        );
}

.nivel-2{
    background:
        linear-gradient(
            160deg,
            #ffe78c,
            #f4bf5c
        );
}

.nivel-3{
    background:
        linear-gradient(
            160deg,
            #ff9b8e,
            #ed625f
        );
}

.circulo-icono{
    width:
        clamp(145px,15vw,220px);

    aspect-ratio:1;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            180deg,
            #fffdfb,
            #f9f0ed
        );

    border:
        9px solid rgba(255,255,255,0.90);

    box-shadow:
        0 12px 24px rgba(66,77,132,0.22);

    font-size:
        clamp(70px,8vw,130px);
}

.nombre-nivel{
    margin-top:20px;

    color:white;

    font-size:
        clamp(34px,4vw,58px);

    font-weight:900;

    text-shadow:
        0 5px 4px rgba(63,63,94,0.18);
}

.tarjeta-nivel.seleccionada{
    z-index:20;

    transform:
        translate(
            var(--mover-x),
            var(--mover-y)
        )
        scale(1.16);
}

.tarjeta-nivel.salir-izquierda{
    transform:
        translateX(-135vw)
        rotate(-7deg)
        scale(0.78);

    opacity:0;
}

.tarjeta-nivel.salir-derecha{
    transform:
        translateX(135vw)
        rotate(7deg)
        scale(0.78);

    opacity:0;
}


/* =========================================================
   PANTALLA DEL JUEGO
========================================================= */

#pantallaJuego{
    display:none;

    width:100%;
    height:100%;

    padding:
        clamp(18px,3vh,38px)
        clamp(18px,4vw,70px);

    flex-direction:column;
    align-items:center;
    justify-content:center;

    opacity:0;

    transition:
        opacity 0.55s ease;
}

#pantallaJuego.visible{
    display:flex;
    opacity:1;
}

#estado{
    min-width:min(750px,90vw);

    padding:
        clamp(14px,2vh,23px)
        clamp(28px,5vw,65px);

    border-radius:35px;

    background:
        rgba(255,255,255,0.95);

    color:#607fc7;

    font-size:
        clamp(28px,4vw,55px);

    font-weight:900;

    box-shadow:var(--sombra);
}

#pregunta{
    min-height:58px;
    max-width:min(900px,92vw);

    margin-top:18px;

    padding:
        14px
        clamp(24px,4vw,52px);

    border-radius:30px;

    background:
        rgba(255,246,206,0.96);

    color:#8d650d;

    font-size:
        clamp(24px,3vw,43px);

    font-weight:900;

    box-shadow:var(--sombra-suave);
}


/* =========================================================
   MODO CINEMATOGRÁFICO
========================================================= */

#modoCine{
    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            #24334c 0%,
            #101726 68%,
            #070b13 100%
        );

    opacity:0;

    transition:
        opacity 0.55s ease;
}

#modoCine.visible{
    display:flex;
    opacity:1;
}

#marcoMultimedia{
    position:relative;

    width:96vw;
    height:94vh;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

#imagenAnimal,
#videoAnimal{
    position:absolute;

    width:100%;
    height:100%;

    max-width:100%;
    max-height:100%;

    object-fit:contain;

    border-radius:24px;

    box-shadow:
        0 20px 65px rgba(0,0,0,0.45);

    opacity:0;

    transition:
        opacity 0.45s ease,
        transform 3s ease-out;
}

#imagenAnimal{
    transform:scale(0.90);
}

#imagenAnimal.visible{
    opacity:1;
    transform:scale(1.06);
}

#imagenAnimal.ocultando{
    opacity:0;
}

#videoAnimal.visible{
    opacity:1;
    transform:scale(1);
}


/* =========================================================
   LECTOR COMPATIBLE CON SMART TV
========================================================= */

#codigo{
    position:fixed;

    top:1px;
    left:1px;

    width:2px;
    height:2px;

    padding:0;
    border:0;

    opacity:0.01;

    z-index:9999;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:800px){

    body{
        overflow-y:auto;
    }

    .aplicacion{
        height:auto;
        min-height:100vh;
    }

    #pantallaInicial{
        min-height:100vh;
    }

    #contenedorNiveles{
        flex-wrap:wrap;
    }

    .tarjeta-nivel{
        width:min(270px,84vw);
        min-height:340px;
    }

}


/* Reduce las animaciones si el dispositivo lo solicita */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:0.01ms !important;
        transition-duration:0.01ms !important;
    }

}

</style>

</head>

     FONDOS
====================================================== -->

];


/* =========================================================
   ELEMENTOS HTML
========================================================= */

var entradaCodigo =
    document.getElementById("codigo");

var pantallaInicial =
    document.getElementById("pantallaInicial");

var pantallaJuego =
    document.getElementById("pantallaJuego");

var estado =
    document.getElementById("estado");

var pregunta =
    document.getElementById("pregunta");

var modoCine =
    document.getElementById("modoCine");

var imagen =
    document.getElementById("imagenAnimal");

var video =
    document.getElementById("videoAnimal");


/* =========================================================
   FONDOS
========================================================= */

var temas = [

    "tema-nubes",

    "tema-burbujas",

    "tema-peces",

    "tema-aves"

];


function cambiarTema(){

    var nuevoIndice;

    do{

        nuevoIndice =
            Math.floor(
                Math.random() *
                temas.length
            );

    }while(
        nuevoIndice === temaActual &&
        temas.length > 1
    );

    for(
        var i = 0;
        i < temas.length;
        i++
    ){
        document.body.classList.remove(
            temas[i]
        );
    }

    temaActual = nuevoIndice;

    document.body.classList.add(
        temas[temaActual]
    );

}


/*
Cambia el fondo cada 5 minutos.

5 minutos:
5 × 60 × 1000 = 300000 milisegundos
*/

setInterval(
    cambiarTema,
    300000
);


/* =========================================================
   FOCO DEL LECTOR
========================================================= */

function mantenerFoco(){

    setTimeout(function(){

        try{
            entradaCodigo.focus();
        }
        catch(error){
            console.log(
                "No fue posible enfocar el lector."
            );
        }

    },100);

}


/* =========================================================
   AUDIO
========================================================= */

function detenerAudio(){

    if(audioActual){

        audioActual.pause();

        audioActual.currentTime = 0;

        audioActual = null;

    }

}


function reproducirAudio(ruta){

    detenerAudio();

    var audio =
        new Audio(ruta);

    audioActual = audio;

    audio.play().catch(function(){

        console.log(
            "El navegador bloqueó temporalmente el audio."
        );

    });

    return audio;

}


/* =========================================================
   PRECARGA DE RECURSOS
========================================================= */

function precargarRecursos(){

    var codigo;

    for(codigo in animales){

        if(
            animales.hasOwnProperty(codigo)
        ){

            var animal =
                animales[codigo];

            var imagenTemporal =
                new Image();

            imagenTemporal.src =
                animal.imagen;


            var audioTemporal =
                new Audio();

            audioTemporal.preload =
                "auto";

            audioTemporal.src =
                animal.audio;


            var videoTemporal =
                document.createElement(
                    "video"
                );

            videoTemporal.preload =
                "metadata";

            videoTemporal.src =
                animal.video;

        }

    }

}


/* =========================================================
   TARJETAS DE NIVEL
========================================================= */

function reiniciarTarjetas(){

    var tarjetas =
        document.getElementsByClassName(
            "tarjeta-nivel"
        );

    for(
        var i = 0;
        i < tarjetas.length;
        i++
    ){

        tarjetas[i].classList.remove(
            "seleccionada"
        );

        tarjetas[i].classList.remove(
            "salir-izquierda"
        );

        tarjetas[i].classList.remove(
            "salir-derecha"
        );

        tarjetas[i].style.removeProperty(
            "--mover-x"
        );

        tarjetas[i].style.removeProperty(
            "--mover-y"
        );

    }

}


function animarSeleccionNivel(numeroNivel){

    var tarjetas =
        document.getElementsByClassName(
            "tarjeta-nivel"
        );

    var seleccionada = null;

    var i;

    for(
        i = 0;
        i < tarjetas.length;
        i++
    ){

        if(
            tarjetas[i].getAttribute(
                "data-nivel"
            ) === String(numeroNivel)
        ){

            seleccionada =
                tarjetas[i];

            break;

        }

    }

    if(!seleccionada){

        entrarAlNivel(numeroNivel);

        return;

    }

    var rect =
        seleccionada.getBoundingClientRect();

    var moverX =
        window.innerWidth / 2 -
        (
            rect.left +
            rect.width / 2
        );

    var moverY =
        window.innerHeight / 2 -
        (
            rect.top +
            rect.height / 2
        );

    seleccionada.style.setProperty(
        "--mover-x",
        moverX + "px"
    );

    seleccionada.style.setProperty(
        "--mover-y",
        moverY + "px"
    );

    seleccionada.classList.add(
        "seleccionada"
    );


    for(
        i = 0;
        i < tarjetas.length;
        i++
    ){

        if(
            tarjetas[i] === seleccionada
        ){
            continue;
        }

        var otroRect =
            tarjetas[i]
            .getBoundingClientRect();

        if(
            otroRect.left <
            rect.left
        ){

            tarjetas[i].classList.add(
                "salir-izquierda"
            );

        }
        else{

            tarjetas[i].classList.add(
                "salir-derecha"
            );

        }

    }


    setTimeout(function(){

        pantallaInicial.style.opacity =
            "0";

        pantallaInicial.style.transform =
            "scale(0.97)";


        setTimeout(function(){

            pantallaInicial.style.display =
                "none";

            pantallaInicial.style.opacity =
                "1";

            pantallaInicial.style.transform =
                "scale(1)";


            pantallaJuego.style.display =
                "flex";

            setTimeout(function(){

                pantallaJuego.classList.add(
                    "visible"
                );

            },30);


            entrarAlNivel(numeroNivel);

            bloqueado = false;

            mantenerFoco();

        },430);

    },1050);

}


/* =========================================================
   SELECCIONAR NIVEL
========================================================= */

function seleccionarNivel(numeroNivel){

    if(bloqueado){
        return;
    }

    bloqueado = true;

    detenerAudio();

    reiniciarTarjetas();


    if(numeroNivel === 1){

        reproducirAudio(
            "recursos/nivel1.mp3"
        );

    }


    if(numeroNivel === 2){

        reproducirAudio(
            "recursos/nivel2.mp3"
        );

    }


    if(numeroNivel === 3){

        reproducirAudio(
            "recursos/nivel3.mp3"
        );

    }


    animarSeleccionNivel(
        numeroNivel
    );

}


function entrarAlNivel(numeroNivel){

    nivelActual = numeroNivel;


    if(numeroNivel === 1){

        estado.innerHTML =
            "🦁 NIVEL 1";

        pregunta.innerHTML =
            "Escanea un animal";

        return;

    }


    if(numeroNivel === 2){

        estado.innerHTML =
            "❓ NIVEL 2";

        pregunta.innerHTML =
            "Busca la tarjeta correcta";

        setTimeout(function(){

            cargarPreguntaNivel2();

        },800);

        return;

    }


    estado.innerHTML =
        "🎵 NIVEL 3";

    pregunta.innerHTML =
        "Nivel 3 próximamente";

}


/* =========================================================
   NIVEL 2
========================================================= */

function cargarPreguntaNivel2(){

    var nuevoIndice;


    if(
        preguntasNivel2.length === 1
    ){

        nuevoIndice = 0;

    }
    else{

        do{

            nuevoIndice =
                Math.floor(
                    Math.random() *
                    preguntasNivel2.length
                );

        }while(
            nuevoIndice ===
            ultimoIndicePregunta
        );

    }


    ultimoIndicePregunta =
        nuevoIndice;

    preguntaActual =
        preguntasNivel2[nuevoIndice];

    estado.innerHTML =
        "❓ NIVEL 2";

    pregunta.innerHTML =
        preguntaActual.pregunta;

}


/* =========================================================
   MODO CINE PARA ANIMALES
========================================================= */

function abrirModoCine(){

    pantallaJuego.classList.remove(
        "visible"
    );

    modoCine.style.display =
        "flex";

    setTimeout(function(){

        modoCine.classList.add(
            "visible"
        );

    },30);

}


function cerrarModoCine(){

    imagen.classList.remove(
        "visible"
    );

    imagen.classList.remove(
        "ocultando"
    );

    video.classList.remove(
        "visible"
    );

    modoCine.classList.remove(
        "visible"
    );


    setTimeout(function(){

        modoCine.style.display =
            "none";

        video.pause();

        video.currentTime = 0;

        video.removeAttribute(
            "src"
        );

        video.load();


        imagen.removeAttribute(
            "src"
        );


        pantallaJuego.style.display =
            "flex";

        setTimeout(function(){

            pantallaJuego.classList.add(
                "visible"
            );

        },30);


        estado.innerHTML =
            "🦁 NIVEL 1";

        pregunta.innerHTML =
            "Escanea otro animal";

        bloqueado = false;

        mantenerFoco();

    },520);

}


/* =========================================================
   MOSTRAR ANIMAL
========================================================= */

function mostrarAnimal(codigo){

    var animal =
        animales[codigo];


    if(
        !animal ||
        bloqueado
    ){
        return;
    }


    bloqueado = true;

    detenerAudio();


    if(temporizadorImagen){

        clearTimeout(
            temporizadorImagen
        );

    }


    if(temporizadorRespaldo){

        clearTimeout(
            temporizadorRespaldo
        );

    }


    /*
    Detiene y elimina cualquier video anterior.
    */

    video.pause();

    video.currentTime = 0;

    video.classList.remove(
        "visible"
    );

    video.removeAttribute(
        "src"
    );

    video.load();


    /*
    Oculta y elimina la fotografía anterior.
    Esto evita ver brevemente el animal anterior.
    */

    imagen.classList.remove(
        "visible"
    );

    imagen.classList.remove(
        "ocultando"
    );

    imagen.removeAttribute(
        "src"
    );


    abrirModoCine();


    /*
    Precarga la nueva imagen antes de mostrarla.
    */

    var nuevaImagen =
        new Image();


    nuevaImagen.onload = function(){

        imagen.src =
            animal.imagen;


        /*
        Prepara el video mientras la imagen
        permanece visible.
        */

        video.src =
            animal.video;

        video.load();


        setTimeout(function(){

            imagen.classList.add(
                "visible"
            );

        },60);


        /*
        Reproduce el nombre del animal.
        */

        reproducirAudio(
            animal.audio
        );


        /*
        Mantiene la fotografía visible
        durante aproximadamente 3 segundos.
        */

        temporizadorImagen =
            setTimeout(function(){

                iniciarVideoAnimal();

            },3000);

    };


    nuevaImagen.onerror = function(){

        /*
        Si la imagen falla, intenta reproducir
        directamente el video.
        */

        video.src =
            animal.video;

        video.load();

        setTimeout(function(){

            iniciarVideoAnimal();

        },500);

    };


    nuevaImagen.src =
        animal.imagen;

}


/* =========================================================
   TRANSICIÓN IMAGEN A VIDEO
========================================================= */

function iniciarVideoAnimal(){

    /*
    Inicia el video detrás de la fotografía.
    Como la fotografía coincide con el primer
    cuadro, la transición resulta más natural.
    */

    var intentoVideo =
        video.play();


    if(
        intentoVideo &&
        typeof intentoVideo.then ===
        "function"
    ){

        intentoVideo.then(function(){

            video.classList.add(
                "visible"
            );


            /*
            Mantiene brevemente la imagen sobre
            el video y luego la desvanece.
            */

            setTimeout(function(){

                imagen.classList.add(
                    "ocultando"
                );

                imagen.classList.remove(
                    "visible"
                );

            },180);

        }).catch(function(){

            cerrarModoCine();

        });

    }
    else{

        video.classList.add(
            "visible"
        );

        setTimeout(function(){

            imagen.classList.add(
                "ocultando"
            );

            imagen.classList.remove(
                "visible"
            );

        },180);

    }


    video.onended =
        cerrarModoCine;

    video.onerror =
        cerrarModoCine;


    /*
    Respaldo de seguridad de 60 segundos.
    Evita que la pantalla quede bloqueada.
    */

    temporizadorRespaldo =
        setTimeout(function(){

            if(bloqueado){

                cerrarModoCine();

            }

        },60000);

}


/* =========================================================
   EVALUAR NIVEL 2
========================================================= */

function evaluarRespuestaNivel2(codigo){

    if(
        bloqueado ||
        !preguntaActual ||
        !animales[codigo]
    ){
        return;
    }


    bloqueado = true;


    if(
        codigo ===
        preguntaActual.correcto
    ){

        estado.innerHTML =
            "⭐ ¡Muy bien!";

        pregunta.innerHTML =
            "Encontraste el animal";


        var audioCorrecto =
            reproducirAudio(
                "recursos/correcto.mp3"
            );


        var preguntaCambiada =
            false;


        function siguientePregunta(){

            if(preguntaCambiada){
                return;
            }

            preguntaCambiada = true;

            cargarPreguntaNivel2();

            bloqueado = false;

            mantenerFoco();

        }


        audioCorrecto.onended =
            function(){

                setTimeout(
                    siguientePregunta,
                    400
                );

            };


        audioCorrecto.onerror =
            function(){

                setTimeout(
                    siguientePregunta,
                    1200
                );

            };


        setTimeout(
            siguientePregunta,
            3200
        );

    }
    else{

        estado.innerHTML =
            "💙 Inténtalo otra vez";

        pregunta.innerHTML =
            preguntaActual.pregunta;


        var audioIncorrecto =
            reproducirAudio(
                "recursos/incorrecto.mp3"
            );


        var desbloqueado =
            false;


        function permitirReintento(){

            if(desbloqueado){
                return;
            }

            desbloqueado = true;

            estado.innerHTML =
                "❓ NIVEL 2";

            pregunta.innerHTML =
                preguntaActual.pregunta;

            bloqueado = false;

            mantenerFoco();

        }


        audioIncorrecto.onended =
            permitirReintento;


        audioIncorrecto.onerror =
            function(){

                setTimeout(
                    permitirReintento,
                    1200
                );

            };


        setTimeout(
            permitirReintento,
            3200
        );

    }

}


/* =========================================================
   PROCESAR CÓDIGOS
========================================================= */

function procesarCodigo(codigo){

    if(
        !codigo ||
        bloqueado
    ){
        return;
    }


    if(codigo === "NIVEL1"){

        seleccionarNivel(1);

        return;

    }


    if(codigo === "NIVEL2"){

        seleccionarNivel(2);

        return;

    }


    if(codigo === "NIVEL3"){

        seleccionarNivel(3);

        return;

    }


    if(nivelActual === 1){

        mostrarAnimal(codigo);

        return;

    }


    if(nivelActual === 2){

        evaluarRespuestaNivel2(
            codigo
        );

    }

}


/* =========================================================
   EVENTO DEL LECTOR
========================================================= */

entradaCodigo.addEventListener(

    "keydown",

    function(evento){

        var tecla =
            evento.key ||
            evento.keyCode;


        if(
            tecla !== "Enter" &&
            tecla !== 13
        ){
            return;
        }


        if(evento.preventDefault){

            evento.preventDefault();

        }


        var codigo =
            entradaCodigo.value
            .replace(
                /^\s+|\s+$/g,
                ""
            )
            .toUpperCase();


        entradaCodigo.value = "";


        procesarCodigo(codigo);

    }

);


/* =========================================================
   INICIO
========================================================= */

document.addEventListener(

    "click",

    function(){

        mantenerFoco();

    }

);


window.addEventListener(

    "focus",

    function(){

        mantenerFoco();

    }

);


window.onload = function(){

    cambiarTema();

    precargarRecursos();

    mantenerFoco();

};

</script>
