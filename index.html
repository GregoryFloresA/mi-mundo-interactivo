<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Mi Mundo Interactivo</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;
    padding:20px;

    min-height:100vh;

    font-family:Arial,sans-serif;

    overflow:hidden;

    background:
    linear-gradient(
        135deg,
        #dff6ff,
        #eef9ff,
        #ffffff
    );

}

/* Fondo animado */

body::before{

    content:"";

    position:fixed;

    width:200%;
    height:200%;

    top:-50%;
    left:-50%;

    background:

    radial-gradient(
        circle,
        rgba(0,180,255,0.08) 0%,
        transparent 20%
    ),

    radial-gradient(
        circle,
        rgba(0,120,255,0.08) 0%,
        transparent 20%
    );

    background-size:
    400px 400px,
    600px 600px;

    animation:
    moverFondo 30s linear infinite;

    z-index:-1;

}

@keyframes moverFondo{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-150px,-100px);
    }

}

h1{

    color:#1f4b99;

    font-size:48px;

    margin-bottom:10px;

}

#codigo{

    width:450px;

    max-width:90vw;

    padding:18px;

    border:none;

    border-radius:30px;

    font-size:28px;

    text-align:center;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.15);

    outline:none;

}

/* Estado */

#estado{

    display:inline-block;

    margin-top:25px;

    padding:15px 35px;

    border-radius:30px;

    background:white;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.1);

    font-size:40px;

    font-weight:bold;

    color:#2854a3;

}

/* Preguntas */

#pregunta{

    display:inline-block;

    margin-top:20px;

    padding:15px 35px;

    background:#fff4d6;

    border-radius:25px;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.08);

    font-size:30px;

    color:#7c5600;

    font-weight:bold;

}

/* Imagen */

#imagenAnimal{

    margin-top:20px;

    max-width:90vw;

    max-height:65vh;

    display:none;

    border-radius:25px;

    box-shadow:
        0 10px 40px rgba(0,0,0,0.20);

}

/* Video */

#videoAnimal{

    margin-top:20px;

    max-width:90vw;

    max-height:65vh;

    display:none;

    border-radius:25px;

    box-shadow:
        0 10px 40px rgba(0,0,0,0.20);

}

</style>

</head>

<body>

<h1>Mi Mundo Interactivo</h1>

<input
    id="codigo"
    type="text"
    autofocus
    placeholder="Escanea una tarjeta">

<div id="estado"></div>

<div id="pregunta"></div>

<br>

<img id="imagenAnimal">

<video id="videoAnimal"></video>

<script>

let nivelActual = 0;
let preguntaActual = null;

let bloqueado = false;

const animales = {

"ANI001":{
nombre:"León",
emoji:"🦁",
imagen:"recursos/leon.jpg",
audio:"recursos/leon.mp3",
video:"recursos/leon.mp4"
},

"ANI002":{
nombre:"Elefante",
emoji:"🐘",
imagen:"recursos/elefante.jpg",
audio:"recursos/elefante.mp3",
video:"recursos/elefante.mp4"
},

"ANI003":{
nombre:"Perro",
emoji:"🐶",
imagen:"recursos/perro.jpg",
audio:"recursos/perro.mp3",
video:"recursos/perro.mp4"
},

"ANI004":{
nombre:"Gato",
emoji:"🐱",
imagen:"recursos/gato.jpg",
audio:"recursos/gato.mp3",
video:"recursos/gato.mp4"
},

"ANI005":{
nombre:"Vaca",
emoji:"🐮",
imagen:"recursos/vaca.jpg",
audio:"recursos/vaca.mp3",
video:"recursos/vaca.mp4"
}

};

const preguntas = [

{
pregunta:"¿Dónde está el león?",
correcto:"ANI001"
},

{
pregunta:"¿Dónde está el elefante?",
correcto:"ANI002"
},

{
pregunta:"¿Dónde está el perro?",
correcto:"ANI003"
},

{
pregunta:"¿Dónde está el gato?",
correcto:"ANI004"
},

{
pregunta:"¿Dónde está la vaca?",
correcto:"ANI005"
}

];

const estado =
document.getElementById("estado");

const pregunta =
document.getElementById("pregunta");

const imagen =
document.getElementById("imagenAnimal");

const video =
document.getElementById("videoAnimal");

function reproducirAudio(ruta)
{
    const audio = new Audio(ruta);
    audio.play();
    return audio;
}

function mostrarEsperaNivel()
{
    estado.innerHTML =
    "ESCANEA UN NIVEL";

    pregunta.innerHTML = "";

    reproducirAudio(
        "recursos/escanea.mp3"
    );
}

function iniciarNivel1()
{
    nivelActual=1;

    estado.innerHTML=
    "NIVEL 1";

    pregunta.innerHTML=
    "Escanea un animal";

    reproducirAudio(
        "recursos/nivel1.mp3"
    );
}

function iniciarNivel2()
{
    nivelActual=2;

    estado.innerHTML=
    "NIVEL 2";

    reproducirAudio(
        "recursos/nivel2.mp3"
    );

    setTimeout(
        cargarPregunta,
        1500
    );
}

function cargarPregunta()
{
    let indice =
    Math.floor(
        Math.random()*preguntas.length
    );

    preguntaActual=
    preguntas[indice];

    pregunta.innerHTML=
    preguntaActual.pregunta;
}

function mostrarAnimal(codigo)
{
    let animal = animales[codigo];

    if(!animal)return;

    bloqueado = true;

    estado.innerHTML =
    animal.emoji + " " +
    animal.nombre;

    pregunta.innerHTML = "";

    imagen.src=animal.imagen;

    imagen.style.display=
    "block";

    video.style.display=
    "none";

    let audio =
    reproducirAudio(
        animal.audio
    );

    audio.onended=function(){

        imagen.style.display=
        "none";

        video.src=
        animal.video;

        video.style.display=
        "block";

        video.play();

    };

    video.onended=function(){

        video.style.display=
        "none";

        bloqueado = false;

        estado.innerHTML=
        "NIVEL 1";

        pregunta.innerHTML=
        "Escanea un animal";

    };
}

function evaluarPregunta(codigo)
{

    if(!preguntaActual)return;

    if(
        codigo===
        preguntaActual.correcto
    )
    {

        reproducirAudio(
            "recursos/correcto.mp3"
        );

        estado.innerHTML=
        "✅ Muy bien";

        setTimeout(()=>{

            estado.innerHTML=
            "NIVEL 2";

            cargarPregunta();

        },2000);

    }
    else
    {

        reproducirAudio(
            "recursos/incorrecto.mp3"
        );

        estado.innerHTML=
        "❌ Inténtalo otra vez";

    }

}

document
.getElementById("codigo")
.addEventListener(
"keydown",
function(event){

if(event.key!=="Enter")
return;

if(bloqueado)
{
    this.value="";
    return;
}

let codigo=
this.value
.trim()
.toUpperCase();

this.value="";

if(codigo==="NIVEL1")
{
    iniciarNivel1();
    return;
}

if(codigo==="NIVEL2")
{
    iniciarNivel2();
    return;
}

if(codigo==="NIVEL3")
{
    estado.innerHTML=
    "Nivel 3 próximamente";

    reproducirAudio(
    "recursos/nivel3.mp3"
    );

    return;
}

if(nivelActual===1)
{
    mostrarAnimal(codigo);
    return;
}

if(nivelActual===2)
{
    evaluarPregunta(codigo);
}

});

window.onload=function(){

    estado.innerHTML=
    "ESCANEA NIVEL1 O NIVEL2";

};

</script>

</body>
</html>
