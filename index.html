<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Mi Mundo Interactivo</title>

<style>

body{
    background:#F5F8FA;
    font-family:Arial, sans-serif;
    text-align:center;
    margin:0;
    padding:40px;
}

h1{
    color:#2c3e50;
}

input{
    font-size:24px;
    padding:10px;
    width:300px;
    text-transform:uppercase;
}

#resultado{
    margin-top:30px;
    font-size:36px;
    font-weight:bold;
}

</style>

</head>

<body>

<h1>Mi Mundo Interactivo</h1>

<p>Escanea una tarjeta o escribe un código</p>

<input
    id="codigo"
    type="text"
    autofocus
    placeholder="ANI001">

<div id="resultado"></div>

<br>

<img
    id="imagenAnimal"
    style="
        max-width:600px;
        display:none;
        border-radius:15px;
    ">

<br><br>

<video
    id="videoAnimal"
    controls
    style="
        max-width:800px;
        display:none;
    ">
</video>

<script>

document
.getElementById("codigo")
.addEventListener("keydown",function(event){

    if(event.key==="Enter")
    {

        let codigo=
        this.value
        .trim()
        .toUpperCase();

        procesarCodigo(codigo);

        this.value="";

    }

});

function procesarCodigo(codigo)
{

    let resultado =
        document.getElementById("resultado");

    let imagen =
        document.getElementById("imagenAnimal");

    let video =
        document.getElementById("videoAnimal");

    if(codigo==="ANI001")
    {

        resultado.innerHTML="🦁 León";

        imagen.src="recursos/leon.jpg";
        imagen.style.display="block";

        video.style.display="none";

        let audio =
            new Audio("recursos/leon.mp3");

        audio.play();

        audio.onended = function()
        {

            video.src=
                "recursos/leon.mp4";

            video.style.display=
                "block";

            video.play();

        };

        return;
    }

    resultado.innerHTML=
        "❌ Código no encontrado";

}

</script>

</body>

</html>
